# ---------------------------------------------------------------------------
# Real MySQL 8 profile:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Schema and seed data are still owned exclusively by Flyway.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/parking_lot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false
